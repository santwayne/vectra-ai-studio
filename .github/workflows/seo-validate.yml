name: SEO & JSON-LD Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 4173 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break || sleep 2
          done

      - name: Validate JSON-LD + SEO on all routes
        env:
          BASE_URL: http://localhost:4173
        run: node scripts/validate-jsonld.mjs

      - name: Stop preview server
        if: always()
        run: kill $(cat preview.pid) || true
